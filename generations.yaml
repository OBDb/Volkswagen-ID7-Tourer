    description: "The Volkswagen ID.7 Tourer is an electric estate/station wagon built on Volkswagen's MEB platform, unveiled on February 20, 2024. It shares the same dimensions and platform as the ID.7 liftback while offering enhanced cargo capacity with 605 liters of storage with rear seats up and 1,714 liters when folded. The Tourer features a drag coefficient of approximately 0.24 Cd for excellent efficiency. Powertrain options include the rear-wheel drive ID.7 Pro with a 77 kWh usable battery and the ID.7 Pro S with an 86 kWh usable battery, both using Volkswagen's APP 550 permanent magnet synchronous motor producing approximately 286 hp. The dual-motor all-wheel drive ID.7 GTX variant joined the lineup in June 2024, adding an AKA 150 front motor for a combined output of 340 hp. DC fast charging supports up to 200 kW, enabling 10-80% charge in approximately 30 minutes. Interior features include a 15-inch touchscreen infotainment system, augmented reality head-up display, optional panoramic sunroof with smart glass that can switch between transparent and opaque via voice command, and improved software with better touch controls. The ID.7 Tourer replaces the Passat and Arteon wagons in Volkswagen's European lineup as the brand's flagship electric estate."